<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Giriş · {{ app_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339d8c8' stroke-width='2.5'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='3.5'/><path d='M12 12 19 5'/></svg>">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" method="post" action="/giris">
      <div class="login-brand">
        <span class="dish">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12 19 5"/>
          </svg>
        </span>
        <h1>{{ app_name }}</h1>
        <p>uzaktan · proje bazlı SAP işleri</p>
      </div>

      {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}

      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="l-user">Kullanıcı adı</label>
        <input id="l-user" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="l-pass">Şifre</label>
        <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary login-submit" type="submit">Giriş yap</button>
      <p class="login-foot">sürüm {{ app_version }}</p>
    </form>
  </main>
</body>
</html>
